<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React interview demos</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 16px; line-height: 1.5; }
      section { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
      h2 { font-size: 1.1rem; margin-top: 0; }
      .backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / 0.4); display: grid; place-items: center; }
      [role='dialog'] { background: white; padding: 1.5rem; border-radius: 8px; color: black; }
      .up { color: green; } .down { color: crimson; }
      .door { display: inline-block; padding: 0 4px; color: white; } .door.red { background: red; } .door.blue { background: blue; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
