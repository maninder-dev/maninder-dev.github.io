<div class="card" style="max-width: 720px; margin: 0 auto">
  <div class="page-head">
    <h2>My Profile</h2>
    <span class="badge {{ auth.user()?.role }}">{{ auth.user()?.role }}</span>
  </div>
  @if (message(); as m) {
    <div class="alert alert-{{ m.type }}">{{ m.text }}</div>
  }
  <form (ngSubmit)="submit()">
    <div class="row">
      <div class="field">
        <label>Full name</label>
        <input name="name" [(ngModel)]="form.name" required />
      </div>
      <div class="field">
        <label>Email</label>
        <input name="email" type="email" [(ngModel)]="form.email" required />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Roll no.</label>
        <input name="rollNo" [(ngModel)]="form.rollNo" />
      </div>
      <div class="field">
        <label>Course</label>
        <input name="course" [(ngModel)]="form.course" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Phone</label>
        <input name="phone" [(ngModel)]="form.phone" />
      </div>
      <div class="field">
        <label>New password (leave blank to keep)</label>
        <input name="password" type="password" minlength="6" [(ngModel)]="form.password" />
      </div>
    </div>
    <app-image-picker label="Profile photo" [current]="imageUrl(auth.user()?.avatar)" (fileChange)="avatar = $event" />
    <button class="btn-primary" [disabled]="busy()">{{ busy() ? 'Saving…' : 'Save Profile' }}</button>
  </form>
</div>
