<div class="card auth-card">
  <h2>Login</h2>
  @if (error()) {
    <div class="alert alert-error">{{ error() }}</div>
  }
  <form (ngSubmit)="submit()">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" [(ngModel)]="form.email" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" [(ngModel)]="form.password" required />
    </div>
    <button class="btn-primary" [disabled]="busy()">{{ busy() ? 'Signing in…' : 'Login' }}</button>
  </form>
  <p class="muted">New student? <a routerLink="/register">Create an account</a></p>
</div>
